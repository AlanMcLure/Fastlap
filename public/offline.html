<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Sin conexión · FastLap</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: #000; color: #e8e8e8; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 26rem; }
    .dots { display: inline-grid; grid-template-columns: repeat(3, 14px); gap: 8px; margin-bottom: 28px; }
    .dots i { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
    .dots i.dim { opacity: .3; }
    .label { font: 12px/1 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: .12em; color: #999; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: 1.75rem; color: #fff; }
    p { margin: 0 0 24px; line-height: 1.6; color: #999; }
    button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 999px; padding: 12px 24px; background: #fff; color: #000; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i class="dim"></i><i></i><i class="dim"></i><i class="dim"></i></div>
    <div class="label">Sin conexión</div>
    <h1>No hay conexión a internet</h1>
    <p>FastLap necesita red para cargar las comunidades, los pronósticos y los datos de la temporada. Comprueba tu conexión e inténtalo de nuevo.</p>
    <button type="button" onclick="location.reload()">Reintentar</button>
  </main>
</body>
</html>
