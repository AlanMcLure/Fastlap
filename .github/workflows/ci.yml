name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed)
        run: docker build -t fastlap:ci .
      - name: Build the migration image
        run: docker build --target migrate -t fastlap-migrate:ci .
